<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  /**
   * Service worker setup
   */
   window.onload = () => {
    'use strict';
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    /**
     * Make sure screen is always on when run on Chrome
     */
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request()
        .catch((e) => { console.warn('failed to acquire wake lock'); })
        ;
    }
  }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="theme-color" content="black"/>
  <link rel="manifest" href="manifest.json">
  <title>Digital Clock</title>
  <link rel="stylesheet" href="./clock.css"/>
  <script src="src/jscolor.min.js"></script>
  <link rel="stylesheet" href="./fonts/material-symbols.css"/>
</head>
<body>
  <div id="config" class="hidden">
    <input type="checkbox">
    <span></span>  <!-- hamburger top -->
    <span></span>  <!-- hamburger middle -->
    <span></span>  <!-- hamburger bottom -->
    <div id="options">
      <div id="colors">
        <i class="material-symbols-outlined">palette</i>
        <div class="color red"></div>
        <div class="color orange"></div>
        <div class="color yellow"></div>
        <div class="color green"></div>
        <div class="color ocean"></div>
        <div class="color blue"></div>
        <div class="color darkblue"></div>
        <div class="color custom" data-jscolor="{}" id="custom"></div>
      </div>
      <div id="timer">
        <fieldset>
          <i class="material-symbols-outlined" id="set-timer">timer</i>
          <input size="6" value="15:00" name="set-time">
          <i class="material-symbols-outlined" id="start-timer">play_circle</i>
          <i class="material-symbols-outlined" id="pause-timer" style="display:none">pause_circle</i>
          <!-- <i class="material-symbols-outlined" id="pomodoro" title="Pomodoro">nutrition</i> -->
        </fieldset>
        <!-- fieldset id="add-time">
          <i class="material-symbols-outlined">more_time</i>
          <input size="4" value="30" name="add-time">
        </fieldset -->
        <i class="material-symbols-outlined" id="stop-timer">timer_off</i>
      </div>
      <div id="display">
        <label><input type="checkbox" id="show-seconds"> Seconds</label>
        <label><input type="checkbox" id="blink-dots"> Blinking dots</label>
        <i class="material-symbols-outlined" id="pip" title="Always on top" style="display:none">picture_in_picture_alt</i>
      </div>
    </div>
  </div>
  <div id="clock"></div>
  <div id="status"></div>
  <script type="module">
  import { Clock } from './src/clock.js';
  import { addColor, getColorFromHash, reload, getOption, setOption } from './src/config.js';
  import { Timer } from './src/timer.js';
  // import { Pomodoro } from './src/pomodoro.js';
  import { pipSupported, openPip } from './src/pip.js';

  const clockEl = document.querySelector('#clock');
  const statusEl = document.querySelector('#status');
  const timer = new Timer();
  // const pomodoro = new Pomodoro(timer, beep);
  let blinkDots = getOption('blinkDots', false);
  let audio = null;

  /**
   * Short beep marking the next pomodoro phase
   */
  function beep() {
    if (!audio) {
      return;
    }
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    oscillator.frequency.value = 880;
    gain.gain.value = 0.2;
    oscillator.connect(gain).connect(audio.destination);
    oscillator.start();
    oscillator.stop(audio.currentTime + 0.3);
  }

  /**
   * Config panel: the hamburger hides after a while and shows up again
   * on mouse movement in the top-left corner, a touch there, or a swipe from the left edge
   */
  const HAMBURGER_TIMEOUT = 5000;
  const CORNER_SIZE = 150;
  const EDGE_SIZE = 30;
  const configEl = document.querySelector('#config');
  const menuToggle = configEl.querySelector('input[type=checkbox]');
  let hideHandle = null;
  let swipeStartX = null;

  function showHamburger() {
    configEl.classList.remove('hidden');
    clearTimeout(hideHandle);
    hideHandle = setTimeout(() => {
      if (!menuToggle.checked) {
        configEl.classList.add('hidden');
      }
    }, HAMBURGER_TIMEOUT);
  }

  function closeMenu() {
    menuToggle.checked = false;
    showHamburger();
  }

  const inCorner = ({ clientX, clientY }) => clientX < CORNER_SIZE && clientY < CORNER_SIZE;
  menuToggle.addEventListener('change', showHamburger);
  document.addEventListener('mousemove', e => inCorner(e) && showHamburger());
  document.addEventListener('touchstart', e => {
    const touch = e.touches[0];
    if (inCorner(touch)) {
      showHamburger();
    }
    swipeStartX = (touch.clientX < EDGE_SIZE) ? touch.clientX : null;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (swipeStartX !== null && e.touches[0].clientX - swipeStartX > EDGE_SIZE) {
      swipeStartX = null;
      showHamburger();
    }
  }, { passive: true });
  showHamburger();

  /**
   * Nightstand mode, Android app only: a tap anywhere dims the screen and the next one brings it back.
   * Taps in the menu (and the color picker it opens) or the hamburger's corner don't count.
   */
  if (window.ClockApp) {
    let dimmed = false;
    document.addEventListener('click', e => {
      if (menuToggle.checked || configEl.contains(e.target) || inCorner(e)) {
        return;
      }
      dimmed = !dimmed;
      ClockApp.setDimmed(dimmed);
    });
  }

  /**
   * Timer & pomodoro
   */
  const optionsEl = document.querySelector('#options');
  const timerControls = optionsEl.querySelector('#timer');
  const setTimerButton = timerControls.querySelector('#set-timer');
  const timerInput = timerControls.querySelector('input');
  const startTimerButton = timerControls.querySelector('#start-timer');
  const stopTimerButton = timerControls.querySelector('#stop-timer');
  const pauseTimerButton = timerControls.querySelector('#pause-timer');
  // const pomodoroButton = timerControls.querySelector('#pomodoro');

  function showRunning(running) {
    startTimerButton.style.display = running ? 'none' : 'inline';
    pauseTimerButton.style.display = running ? 'inline' : 'none';
  }

  function setTimer(seconds) {
    // pomodoro.stop();
    timer.set(seconds);
  }

  startTimerButton.addEventListener('click', () => {
    if (!timer.initialized) {
      setTimer(timeStrToInt(timerInput.value));
    }
    timer.start();
    showRunning(true);
    closeMenu();
  });
  pauseTimerButton.addEventListener('click', () => {
    timer.stop();
    showRunning(false);
    closeMenu();
  });
  stopTimerButton.addEventListener('click', () => {
    timer.reset();
    // pomodoro.stop();
    showRunning(false);
    closeMenu();
  });
  // pomodoroButton.addEventListener('click', () => {
  //   audio = audio || new AudioContext(); // needs a user gesture to be allowed to play
  //   pomodoro.start();
  //   showRunning(true);
  //   closeMenu();
  // });
  setTimerButton.addEventListener('click', () => setTimer(timeStrToInt(timerInput.value)));
  timerInput.addEventListener('change', () => setTimer(timeStrToInt(timerInput.value)));

  /**
   * Colors
   */
  optionsEl.querySelectorAll('#colors > .color').forEach(div => {
    const color = div.classList.item(1);
    addColor(color);
    div.addEventListener('click', () => {
      reload(color);
      if (color !== 'custom') {
        closeMenu(); // custom one opens the color picker
      }
    });
  });
  window.addEventListener('hashchange', () => clock.setColor(getColorFromHash()));

  /**
   * Display options
   */
  const showSecondsInput = optionsEl.querySelector('#show-seconds');
  const blinkDotsInput = optionsEl.querySelector('#blink-dots');
  const pipButton = optionsEl.querySelector('#pip');

  showSecondsInput.checked = getOption('showSeconds', true);
  blinkDotsInput.checked = blinkDots;
  showSecondsInput.addEventListener('change', () => {
    setOption('showSeconds', showSecondsInput.checked);
    clock.setShowSeconds(showSecondsInput.checked);
    closeMenu();
  });
  blinkDotsInput.addEventListener('change', () => {
    blinkDots = blinkDotsInput.checked;
    setOption('blinkDots', blinkDots);
    closeMenu();
  });
  if (pipSupported) {
    pipButton.style.display = 'inline-block';
    pipButton.addEventListener('click', () => {
      closeMenu();
      openPip(clockEl, restartClock).catch(e => console.warn('failed to open picture-in-picture', e));
    });
  }

  /**
   * What to display
   */
  const pad = num => num.toString().padStart(2, 0);

  const showTime = () => {
    const now = new Date();
    return `${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  };

  const getTimer = () => {
    const total = timer.secondsLeft();
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor(total / 60) % 60;
    const seconds = total % 60;
    if (!clock.showSeconds) {
      // only 4 digits to fill
      return (hours > 0) ? `${pad(hours)}${pad(minutes)}` : `${pad(minutes)}${pad(seconds)}`;
    }
    return `${(hours > 0) ? pad(hours) : ''}${pad(minutes)}${pad(seconds)}`;
  };

  function timeStrToInt(timeStr = '') {
    const [hours, minutes, seconds] = timeStr.replace(/:/g, '').padStart(6, 0).match(/\d{2}/g);
    return Number(seconds) + Number(minutes) * 60 + Number(hours) * 3600;
  }

  function getTimeString() {
    if (timer.initialized) {
      return getTimer();
    }
    const time = showTime();
    return clock.showSeconds ? time : time.slice(0, 4);
  }

  /**
   * Dots blink in the first half of each second (of the countdown, when the timer runs)
   */
  function dotsLit() {
    if (!blinkDots) {
      return true;
    }
    if (timer.initialized) {
      const ms = timer.msLeft();
      return !timer.running || ms === 0 || ms % 1000 >= 500;
    }
    return Date.now() % 1000 < 500;
  }

  /**
   * Clock runner; frames come from the window that currently shows the clock
   * (the picture-in-picture one keeps running when this tab is in the background)
   */
  let frame = null;

  function runClock() {
    // pomodoro.tick();
    clock.setDotsLit(dotsLit());
    document.title = clock.write(getTimeString());
    // if (statusEl.textContent !== pomodoro.label) {
    //   statusEl.textContent = pomodoro.label;
    // }
    const win = clockEl.ownerDocument.defaultView;
    frame = { win, id: win.requestAnimationFrame(runClock) };
  }

  function restartClock() {
    if (frame) {
      frame.win.cancelAnimationFrame(frame.id);
    }
    runClock();
  }

  /**
   * Build & run!
   */
  reload(); // load default color
  const clock = new Clock(clockEl, getColorFromHash(), { showSeconds: showSecondsInput.checked });
  runClock();

  /**
   * handler to set custom color
   */
  jscolor.install();
  const custom = document.querySelector('#custom');
  custom.jscolor.fromString(localStorage.getItem('colorHex') || '#fff');
  custom.jscolor.onChange = function setCustomColor() {
    const color = this.toHEXString();
    reload('custom', color);
  }
</script>
</body>
</html>
